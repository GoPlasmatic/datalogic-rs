name: Repo-wide Rust lint
description: |
  Sets up the stable Rust toolchain (rustfmt + clippy + the wasm32 target),
  restores a shared cargo cache, and runs `make fmt-check` + `make clippy`
  over every Cargo manifest in the tree — the root workspace plus the
  bindings and fuzz crate it excludes.

  Shared by ci.yml's check job and, through ci.yml, by the release, so a
  release can never validate against a narrower lint surface than a PR:
  one definition instead of two mirrored blocks that could drift.

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        components: rustfmt, clippy
        # `make clippy` lints bindings/wasm with `--target
        # wasm32-unknown-unknown` so tests/web.rs — which is
        # `#![cfg(target_arch = "wasm32")]` and compiles to an empty file
        # on the host — actually gets checked. The Makefile fails hard when
        # the target is missing and `CI` is set, so dropping this line
        # breaks the build instead of silently shrinking coverage.
        targets: wasm32-unknown-unknown

    # rust-cache keys on the toolchain and on every Cargo.toml and
    # Cargo.lock it finds, and caches dependencies only (never our own
    # crates), so a source change never restores stale artifacts and the
    # cache cannot grow without bound. One entry per workspace `make
    # clippy` walks, the fuzz crate included (it lints on stable).
    - name: Cache cargo (lint)
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: lint
        workspaces: |
          . -> target
          bindings/c -> target
          bindings/node -> target
          bindings/python -> target
          bindings/wasm -> target
          crates/datalogic-rs/fuzz -> target

    - name: Check formatting
      shell: bash
      run: make fmt-check

    - name: Run clippy
      # The flags (`--all-features --all-targets -- -D warnings`) live in
      # the Makefile's CLIPPY_FLAGS — `--all-features` so feature-gated
      # paths get linted too. `make clippy` runs every crate through a `-k`
      # sub-make, so one failing crate never hides the others.
      shell: bash
      run: make clippy
