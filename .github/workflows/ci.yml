name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-check.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-check.yml'
  # release.yml runs this whole workflow against the tagged commit before
  # anything publishes, so a release passes exactly the gates a PR does
  # (feature matrix, MSRV, minimal versions, docs, examples, every binding)
  # instead of a narrower copy of them. Docs-only changes skip CI above;
  # docs-check.yml covers those.
  workflow_call:

# On a PR, a newer push makes the running checks moot, so cancel them. On
# main, let every run finish: back-to-back merges must each end with a
# result, or a broken commit hides behind the one that cancelled it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for the whole workflow. CI only ever reads the repo —
# it builds, tests, and lints. Nothing here creates a release, pushes a
# tag, or comments on a PR.
#
# Declaring this explicitly matters because an absent `permissions:` key
# inherits the repository/organisation default, which on older repos is
# still read-write. That would hand a repo-writable GITHUB_TOKEN to every
# job that compiles third-party crates and runs `npm install` on the UI.
# Fork PRs already get a read-only token regardless; this closes the same
# gap for `push` builds on main.
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Marketing stats (conformance counts, benchmark geomean, MSRV) are
      # quoted in READMEs and badges; this fails the build when a quote
      # drifts from its canonical source. Count drift only warns here (the
      # release validate job runs it with --strict). Runs before toolchain
      # setup — it only needs bash + python3.
      - name: Check quoted stats against canonical sources
        run: bash scripts/check-stats.sh

      # Every feature-gated integration test declares the same features as
      # `[[test]] required-features`, so it is skipped, not compiled to an
      # empty binary, when they are off.
      - name: Check integration tests' required-features
        run: bash scripts/check-test-features.sh

      # Toolchain + shared cargo cache + `make fmt-check` / `make clippy`
      # over every Cargo manifest — bare `cargo fmt --all` / `cargo clippy
      # --workspace` only see the root-workspace members. Factored into
      # a composite action; the toolchain and cache it sets up also serve
      # the steps below.
      - name: Lint (fmt + clippy, every manifest)
        uses: ./.github/actions/rust-lint

      - name: Run tests
        # `--all-features` is required to exercise the gated integration
        # tests: most declare `required-features = ["serde_json", ...]`,
        # and the JSONLogic suite runner additionally needs `templating`;
        # without them cargo skips those targets. `--locked`: the committed
        # Cargo.lock must already describe the manifests, so a PR that
        # changes a dependency has to commit the resolution it was tested
        # with.
        run: cargo test --workspace --all-features --locked

      - name: Run tests (no default features)
        # The default (feature-free) build ships only the JSONLogic baseline
        # and no external deps. Its behavioral tests need `serde_json`, so
        # this mainly guards that the minimal build keeps compiling and its
        # doctests pass; the `--all-features` run above never exercises it.
        run: cargo test -p datalogic-rs --no-default-features --locked

      - name: Run examples (all features)
        # Builds and runs every example, so one that compiles but panics or
        # prints the wrong thing cannot rot unnoticed. Each `[[example]]`
        # with feature needs declares `required-features`, so only
        # `--all-features` reaches every one.
        run: |
          set -euo pipefail
          for f in crates/datalogic-rs/examples/*.rs; do
            name=$(basename "$f" .rs)
            echo "::group::example $name"
            cargo run -p datalogic-rs --all-features --locked --example "$name"
            echo "::endgroup::"
          done

      - name: Build docs (deny warnings)
        # Treat broken intra-doc links and missing-docs warnings as
        # errors so docs.rs builds (which run with the same effective
        # settings via `[package.metadata.docs.rs]`) don't regress.
        # `--no-deps` keeps the run scoped to our crate; transitive
        # dep warnings are not our problem.
        #
        # Run twice: with `--all-features` (matches the docs.rs build)
        # AND with default features. Intra-doc links to feature-gated
        # items are easy to write and only fail in the feature-off
        # build — a contributor running plain `cargo doc` hits them
        # but CI used to miss them.
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc -p datalogic-rs --all-features --no-deps --locked
          cargo doc -p datalogic-rs --no-deps --locked

  # Semver gate on the published crate's public API. Compares the tree
  # against the newest release on crates.io and fails on any breaking
  # change: 5.x promises none, so `--release-type minor` (additions are
  # fine without a version bump on a PR). The release validate job runs it
  # again without the flag, so a patch release cannot carry an addition.
  semver:
    name: Semver (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: ./.github/actions/install-cargo-tools
        with:
          cargo-semver-checks: 'true'

      - name: Check the public API against the last release
        run: cargo semver-checks check-release -p datalogic-rs --all-features --release-type minor

  # cargo-deny over every shipping workspace: RustSec advisories, the
  # license allow list, crates.io as the only source (deny.toml). The
  # weekly run in scheduled.yml catches advisories published against
  # dependencies no PR touched.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: ./.github/actions/install-cargo-tools
        with:
          cargo-deny: 'true'

      - name: cargo deny (every shipping workspace)
        run: make deny

  feature-matrix:
    name: Feature (${{ matrix.feature }})
    runs-on: ubuntu-latest
    # The `check` job covers `--all-features` and `--no-default-features`
    # and nothing between, so a feature-gated item referenced from another
    # feature's code compiles fine in both of those configurations and
    # breaks only for the user who enables one feature on its own. Each
    # leg here builds exactly one feature to catch that.
    #
    # `build`, not `test`: most integration tests need `serde_json` and
    # would be skipped under the other legs. Compiling each feature
    # standalone is the property worth guarding.
    #
    # Warnings are errors: an unused import or dead item that only shows
    # up with one feature on is exactly what this matrix exists to find,
    # and clippy (all features) cannot see it.
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        # Every opt-in feature except `wasm-clock`, which is a weak-dep
        # modifier (`chrono?/wasmbind`) — inert without `datetime` and on
        # non-wasm targets. The `wasm-build` job already guards it.
        feature:
          - serde_json
          - templating
          - datetime
          - trace
          - error-handling
          - ext-string
          - ext-array
          - ext-object
          - ext-control
          - ext-math
          - flagd
          - tensor
          - tensor-half
          - budget
          - all-operators
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # One cache per leg: each builds a different feature set.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: featmat-${{ matrix.feature }}

      - name: Build with only `${{ matrix.feature }}` enabled
        run: cargo build -p datalogic-rs --no-default-features --features ${{ matrix.feature }} --locked

  feature-combos:
    name: Conformance (${{ matrix.combo }})
    runs-on: ubuntu-latest
    # `feature-matrix` above can only *build* its legs: the conformance runner
    # requires `serde_json` + `templating`, so a single-feature leg skips it
    # without evaluating a single rule.
    #
    # These legs pair that baseline with one operator family at a time, so the
    # battery actually runs. It used to fail here — the index lists every suite
    # and a build without `ext-control` cannot evaluate `switch` — which is now
    # handled by the runner skipping cases whose operators are not compiled in
    # (see crates/datalogic-rs/tests/README.md). What this guards is the code
    # *between* the two endpoints `check` covers: anything that assumes an
    # operator family is present, or that mis-`cfg`s a compile-time table.
    strategy:
      fail-fast: false
      # `include` entries rather than a bare list of feature strings: the
      # cache key below is per leg, and a cache key cannot contain a
      # comma. Expressions have no `replace()`, so each leg carries a
      # comma-free `slug` for the key to interpolate instead.
      matrix:
        include:
          - combo: serde_json,templating,trace
            slug: baseline
          - combo: serde_json,templating,trace,error-handling
            slug: error-handling
          - combo: serde_json,templating,trace,ext-array
            slug: ext-array
          - combo: serde_json,templating,trace,ext-control
            slug: ext-control
          - combo: serde_json,templating,trace,datetime
            slug: datetime
          - combo: serde_json,templating,trace,ext-string,ext-object,ext-math
            slug: ext-string-object-math
          # `tensor` needs `ext-control` + `ext-array` in the mix: the
          # suites reach for `type` and `sort` to assert how a tensor
          # behaves as a value.
          - combo: serde_json,templating,trace,tensor,ext-control,ext-array
            slug: tensor
          - combo: serde_json,templating,trace,tensor,tensor-half,ext-control,ext-array
            slug: tensor-half
          # `budget` charges from inside every iterator operator and the
          # tensor family, and `try` has to refuse to catch its error, so
          # the leg that matters pairs it with `error-handling` and the
          # array operators rather than running it alone.
          - combo: serde_json,templating,trace,budget,error-handling,ext-array,ext-control
            slug: budget-error-handling
          - combo: serde_json,templating,trace,budget,tensor,ext-control,ext-array
            slug: budget-tensor
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # Keyed per combo like `feature-matrix`: the legs build different
      # feature sets, so one shared `target/` would be rebuilt by every
      # leg but the one that saved it.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: combos-${{ matrix.slug }}

      - name: Test with `${{ matrix.combo }}`
        run: cargo test -p datalogic-rs --no-default-features --features ${{ matrix.combo }} --locked

  msrv:
    name: MSRV (Rust 1.98)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Floor tracks `datavalue-rs` 0.3, which declares 1.98; the
      # library's own language use is still well below that.
      # scripts/check-stats.sh fails if this drifts from `rust-version`.
      - name: Setup Rust 1.98 (matches `rust-version` in Cargo.toml)
        uses: dtolnay/rust-toolchain@1.98.0

      # rust-cache keys on the toolchain version, so this never mixes
      # with the stable jobs' artifacts.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      # Build only — test infra (proc-macros, tooling) often outgrows MSRV
      # without the library code itself doing so. We want to catch the
      # library-code regression, not chase tooling churn.
      - name: Build (all features)
        run: cargo build --workspace --all-features --locked

  minimal-versions:
    name: Minimal-versions resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # `-Z minimal-versions` is a nightly-only resolver mode that picks
      # the lowest version that satisfies each dep's `^X.Y` requirement,
      # rather than the latest. Catches under-pinned semver-incompatible
      # deps (e.g. a `bumpalo = "3"` requirement that secretly needs a
      # 3.x feature added in 3.4 — we'd want `bumpalo = "3.4"`).
      - name: Setup nightly toolchain
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly

      # Install a *stable* toolchain too — the actual build runs on
      # stable; nightly is only used to *resolve* the lockfile.
      - name: Setup stable toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # Rewrites the committed Cargo.lock in this checkout only; the
      # build below must therefore not pass `--locked`.
      - name: Resolve with minimal versions
        run: cargo +nightly update -Z minimal-versions

      # `tools/benchmark` is dev-only; under `--all-features` it pulls
      # `jsonlogic-rs 0.5` → `phf 0.8` → `proc-macro-hack 0.5.4` → broken
      # `syn 0.15.14` (AttributeArgs gating bug). We can't pin transitives
      # we don't own, and the gate's purpose is to catch regressions in
      # the library code we publish (`datalogic-rs`), so exclude the
      # benchmark crate.
      - name: Build with minimal versions
        run: cargo +stable build --workspace --all-features --exclude datalogic-bench

      - name: Test with minimal versions
        run: cargo +stable test --workspace --all-features --exclude datalogic-bench

  # Cross-platform validation of the Go binding's full cgo path on every
  # PR and main push. Delegates to the same reusable workflow release.yml
  # uses, so the matrix + llvm-mingw bootstrap + cgo validation stay in
  # one place. `upload-artifact: false` skips the per-platform artifact
  # upload — CI only needs the validation, not the staging output that
  # publish-go consumes at release time.
  go-cgo:
    name: Go cgo
    uses: ./.github/workflows/release-build-go.yml
    with:
      upload-artifact: false

  # The Go binding against the newest Go release. go-cgo above runs the
  # version go.mod declares (the floor) across every platform; this one
  # leg catches a new Go release breaking the cgo glue before users do.
  go-stable:
    name: Go binding (Go stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - uses: ./.github/actions/c-abi-host

      # Stage the host staticlib and header where the cgo build tags look
      # (lib/linux_amd64/, include/), as release-build-go.yml does.
      - name: Stage staticlib + header into bindings/go/
        run: |
          mkdir -p bindings/go/lib/linux_amd64 bindings/go/include
          cp bindings/c/target/release/libdatalogic_c.a bindings/go/lib/linux_amd64/
          cp bindings/c/include/datalogic.h bindings/go/include/

      - name: go test
        working-directory: bindings/go
        run: |
          go version
          go test ./...

  # C ABI smoke. bindings/c is excluded from the root workspace so
  # `cargo test --workspace` in the check job skips it — without this
  # job, a regression in the C ABI's extern "C" surface (NULL handling,
  # error-state lifetime, cbindgen header drift) wouldn't surface until
  # the go-cgo / python / php / jvm jobs noticed. Running it directly
  # gives a cleaner failure attribution.
  c-abi-test:
    name: C ABI test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Composite action: Rust setup + shared host-target cache + release build.
      # The follow-up `cargo test` reuses the cache, so it only compiles the
      # smoke test binary on top of the already-built lib.
      - uses: ./.github/actions/c-abi-host

      # Runs tests/smoke.rs which exercises the extern "C" surface
      # end-to-end (version, apply, compile, session, parse error, runtime
      # error with path, NULL-safety). The composite already built the lib
      # and regenerated the cbindgen header via build.rs.
      - name: Test C ABI smoke surface
        run: cargo test --manifest-path bindings/c/Cargo.toml --locked

      - name: Verify cbindgen-generated header is up to date
        # The header is committed; the build regenerates it. If the
        # working tree shows a diff, the committed header has drifted
        # from the Rust source — fail loudly so we don't ship a stale
        # header to downstream consumers.
        run: |
          if ! git diff --exit-code bindings/c/include/datalogic.h; then
            echo "::error::bindings/c/include/datalogic.h is out of sync with src/. Run 'cargo build -p datalogic-c' and commit the result."
            exit 1
          fi

      # Build and run the C examples against the c-abi-host cdylib
      # (bindings/c/target/release, already built above) so they can't rot.
      - name: Run examples
        working-directory: bindings/c/examples
        run: make run

  # WASM smoke build. Catches a wasm-pack / Rust target / wasm-opt
  # regression at PR time rather than at release. Single platform —
  # the WASM artifact is platform-agnostic so one runner suffices.
  wasm-build:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown

      # Pinned + cached. The upstream curl-installer fetches whatever
      # version is current at install time — that floats CI across
      # wasm-pack releases and bites you on a release-day regression.
      - name: Install wasm-pack
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: wasm-pack@0.14.0

      # Pinned binaryen (wasm-opt), shared with release-build-wasm.yml so
      # the size gate below measures what the release ships.
      - name: Install binaryen
        uses: ./.github/actions/install-binaryen

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings/wasm -> target

      # build.sh runs wasm-pack, which resolves against bindings/wasm's
      # Cargo.lock but cannot be handed `--locked`; this fails instead if
      # the lockfile no longer describes the manifest.
      - name: Verify bindings/wasm/Cargo.lock is current
        run: cargo metadata --locked --format-version 1 --manifest-path bindings/wasm/Cargo.toml > /dev/null

      - name: Build WASM
        run: cd bindings/wasm && ./build.sh

      # Fails above +5% gzip growth against scripts/wasm-size.baseline
      # (warns above +3%). An intended change commits a new baseline with
      # `scripts/check-wasm-size.sh --update`.
      - name: WASM size gate
        run: bash scripts/check-wasm-size.sh

      - name: Test WASM (node)
        # Runs the committed `#[wasm_bindgen_test]` cases (tests/web.rs),
        # including custom-operator coverage, which the build step alone
        # never executes.
        run: cd bindings/wasm && wasm-pack test --node

      - name: Guard non-JS wasm32 consumers (issue 47)
        # `chrono/wasmbind` must stay opt-in (the `wasm-clock` feature): it
        # links `__wbindgen_placeholder__` imports only a JS host satisfies,
        # so a default wasm32 build of the core crate must never pull
        # wasm-bindgen/js-sys. Regressing this breaks non-JS wasm runtimes
        # (wasmtime, wazero, Chicory). Resolution-only: no wasm target needed.
        run: |
          cd crates/datalogic-rs
          if cargo tree --target wasm32-unknown-unknown --features datetime -e normal | grep -qE 'wasm-bindgen|js-sys'; then
            echo '::error::wasm-bindgen/js-sys leaked into the default wasm32 dependency graph (issue 47 regression)'
            exit 1
          fi

      # Execute the runnable examples against the just-built pkg/nodejs
      # target so they can't rot. Node comes preinstalled on the runner.
      - name: Run examples
        run: |
          cd bindings/wasm
          node examples/getting-started.mjs
          node examples/compile-once-evaluate-many.mjs
          node examples/custom-operator.mjs

      # Hand the built pkg/ to the ui-build job below — saves it the cost
      # of repeating the wasm build from scratch. Not named `wasm-pkg`:
      # release.yml runs this workflow in the same run as its own
      # build-wasm job, which uploads that name, and artifact names are
      # unique per run.
      - name: Upload wasm-pkg
        uses: actions/upload-artifact@v7
        with:
          name: ci-wasm-pkg
          path: bindings/wasm/pkg/
          if-no-files-found: error

  # Python test. Builds the binding via `maturin develop` into a venv,
  # then runs pytest. Single platform — pytest validates logical behavior
  # (error attrs, dict/string conversion, session semantics) which is
  # platform-agnostic. The release-time wheel matrix catches per-platform
  # build issues; this catches Python-level regressions.
  python-test:
    name: Python pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings/python -> target

      # `maturin develop` requires a virtualenv (or conda env) — it installs
      # the freshly-built wheel into the active interpreter's site-packages.
      # actions/setup-python provides only the bare interpreter, so we
      # create a local venv and propagate VIRTUAL_ENV + PATH to subsequent
      # steps via $GITHUB_ENV / $GITHUB_PATH.
      - name: Create venv
        working-directory: bindings/python
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Pinned, dependencies included, so a tool release cannot change the
      # result of re-running a commit.
      - name: Install build + test deps
        run: python -m pip install -r .github/requirements/python-ci.txt

      # `maturin develop --release` builds the binding and installs it
      # into the active venv in one shot. Using --release because debug
      # builds of pyo3 + the engine's compile pass are slow enough to
      # dominate the test run.
      - name: Build + install binding
        working-directory: bindings/python
        run: maturin develop --release --locked

      - name: Run pytest
        working-directory: bindings/python
        run: pytest -v

      # The PEP 561 stubs (datalogic_py.pyi) are hand-written; stubtest
      # diffs them against the compiled module's real surface so a Rust
      # signature change can't land without the matching stub update.
      - name: Check type stubs against runtime (stubtest)
        working-directory: bindings/python
        run: python -m mypy.stubtest datalogic_py --allowlist stubtest-allowlist.txt

      # Execute the runnable examples against the binding installed into
      # the venv above so they can't rot.
      - name: Run examples
        working-directory: bindings/python
        run: |
          python examples/getting_started.py
          python examples/compile_once_evaluate_many.py
          python examples/custom_operator.py

  # Node-binding smoke build. The release-time matrix fans out to 8
  # platforms; mirroring all of them at PR time is expensive and most
  # regressions are platform-agnostic (binding logic, conv layer, error
  # surface). One Linux build + `node --test` catches the common cases
  # and keeps release-build-node from failing for the first time on
  # tag day. The release matrix still validates each prebuild target.
  node-test:
    name: Node binding smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: bindings/node -> target

      # Strict: a package.json that no longer matches package-lock.json is
      # an error, not a fresh resolve.
      - name: Install npm deps
        working-directory: bindings/node
        run: npm ci

      # napi-cli drives cargo itself; this fails if bindings/node's
      # Cargo.lock no longer describes the manifest.
      - name: Verify bindings/node/Cargo.lock is current
        run: cargo metadata --locked --format-version 1 --manifest-path bindings/node/Cargo.toml > /dev/null

      # `napi build --platform --release` emits
      # datalogic-node.<triple>.node + index.js + index.d.ts. Mirrors
      # the release-build-node.yml prebuild step.
      - name: Build .node prebuild
        working-directory: bindings/node
        run: npx napi build --platform --release

      - name: Run node:test
        working-directory: bindings/node
        run: npm test

      # Execute the runnable examples against the just-built prebuild so
      # they can't rot.
      - name: Run examples
        working-directory: bindings/node
        run: |
          node examples/getting-started.mjs
          node examples/compile-once-evaluate-many.mjs
          node examples/custom-operator.mjs

  # UI lint, tests, type check and library build, against the WASM engine
  # wasm-build just built from this branch. Nothing in the UI resolves
  # @goplasmatic/datalogic-wasm from node_modules: the Vite, Vitest and
  # TypeScript configs alias it to ui/vendor/datalogic, which `npm run
  # sync-wasm` fills from ../bindings/wasm/pkg.
  ui-build:
    name: UI lint, test + build
    needs: wasm-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download wasm-pkg
        uses: actions/download-artifact@v8
        with:
          name: ci-wasm-pkg
          path: bindings/wasm/pkg/

      # Strict: fails when package.json and package-lock.json disagree
      # instead of quietly resolving afresh.
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # `npm test` and `tsc -b` read the vendored engine but have no
      # lifecycle hook that syncs it (only dev / build* do), so sync it
      # explicitly before either runs.
      - name: Vendor the freshly built WASM engine
        working-directory: ui
        run: npm run sync-wasm

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      # The guard suites (catalogue.test.ts pins operators.json against
      # the picker, registry.test.ts, wasm-typings.test.ts, round trips,
      # trace mapping) evaluate against the vendored engine.
      - name: Test UI
        working-directory: ui
        run: npm test

      # The library build is Vite-only and does not type-check; the docs
      # site's `npm run build` does (`tsc -b && vite build`), so a type
      # error used to surface only after merge.
      - name: Type-check UI
        working-directory: ui
        run: npx tsc -b

      - name: Build UI library
        working-directory: ui
        run: npm run build:lib

  # .NET binding smoke. Single platform — the binding is P/Invoke over
  # the C ABI's cdylib, so the .NET-side logic (LibraryImport stubs,
  # marshalling, dispose semantics) is platform-agnostic. The release
  # matrix validates per-RID native libs.
  dotnet-test:
    name: .NET binding test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          # Build SDK only — the projects still target net8.0, so .NET 8
          # consumers are unaffected. SDK 10 is required by the test
          # toolchain (Microsoft.NET.Test.Sdk 18.x, SourceLink 10.x).
          dotnet-version: '10.0.x'

      - uses: ./.github/actions/c-abi-host

      - name: dotnet test
        working-directory: bindings/dotnet
        run: dotnet test -c Release

      # Execute the runnable examples (examples/Examples.csproj is a
      # console project outside the .sln; `dotnet run` builds it against
      # the same c-abi-host cdylib the tests used) so they can't rot.
      - name: Run examples
        working-directory: bindings/dotnet
        run: |
          dotnet run -c Release --project examples -- getting-started
          dotnet run -c Release --project examples -- compile-once
          dotnet run -c Release --project examples -- custom-operator

  # JVM binding smoke. Same rationale as dotnet-test — the binding is
  # java.lang.foreign (FFM) over the C ABI's cdylib. The binding compiles
  # at --release 22, its floor, so it runs on JDK 22 (the floor, now past
  # end of life but what pom.xml promises) and JDK 25 (current LTS).
  jvm-test:
    name: JVM binding test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['22', '25']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('bindings/jvm/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - uses: ./.github/actions/c-abi-host

      - name: mvn test
        working-directory: bindings/jvm
        run: mvn -B test

      # Execute the runnable examples (examples/*.java are single-file
      # programs; the JDK source-file launcher compiles + runs each in one
      # step) so they can't rot. `mvn test` above already compiled
      # target/classes; build-classpath just materialises the dependency
      # classpath (Jackson) into target/cp.txt.
      - name: Run examples
        working-directory: bindings/jvm
        run: |
          mvn -B -q dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          java --enable-native-access=ALL-UNNAMED -cp "target/classes:$(cat target/cp.txt)" -Ddatalogic.library.path=../c/target/release examples/GettingStarted.java
          java --enable-native-access=ALL-UNNAMED -cp "target/classes:$(cat target/cp.txt)" -Ddatalogic.library.path=../c/target/release examples/CompileOnceEvaluateMany.java
          java --enable-native-access=ALL-UNNAMED -cp "target/classes:$(cat target/cp.txt)" -Ddatalogic.library.path=../c/target/release examples/CustomOperator.java

  # PHP binding smoke. Same rationale — PHP FFI over the C ABI. 8.4 is
  # the floor composer.json declares; 8.5 is the newest release.
  php-test:
    name: PHP binding test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi, json
          coverage: none

      - uses: ./.github/actions/c-abi-host

      - name: composer install
        working-directory: bindings/php
        run: composer install --no-interaction --no-progress

      - name: phpunit
        working-directory: bindings/php
        run: vendor/bin/phpunit --no-coverage

      # Execute the runnable examples (the FFI loader falls back to the
      # c-abi-host build at bindings/c/target/release) so they can't rot.
      - name: Run examples
        working-directory: bindings/php
        run: |
          php examples/getting-started.php
          php examples/compile-once-evaluate-many.php
          php examples/custom-operator.php
