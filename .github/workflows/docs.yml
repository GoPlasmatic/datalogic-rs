name: Deploy Documentation

on:
  push:
    branches:
      - main
    # The playground embeds the WASM engine, which is the core crate
    # compiled through bindings/wasm, so a core change redeploys it too.
    paths:
      - 'docs/**'
      - 'ui/**'
      - 'bindings/wasm/**'
      - 'crates/datalogic-rs/src/**'
      - 'crates/datalogic-rs/Cargo.toml'
      - 'crates/datalogic-bind/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Build mdBook documentation. Pinned: `latest` let an mdBook release
      # change the site (or break the build) with no commit here. Keep the
      # version in step with docs-check.yml, which builds the book on PRs.
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.5.4'

      - name: Build documentation
        run: mdbook build docs

      # Build WASM for UI
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: wasm-pack@0.14.0

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bindings/wasm/target/
          # The committed lockfile changes whenever the resolved
          # dependencies do, so it keys the cache along with the manifest.
          key: ${{ runner.os }}-wasm-${{ hashFiles('bindings/wasm/Cargo.toml', 'bindings/wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Build WASM
        run: cd bindings/wasm && ./build.sh

      # Build UI demo and embed bundle
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # Strict install from ui/package-lock.json. The WASM engine is not an
      # npm dependency here: the Vite and TypeScript configs alias
      # @goplasmatic/datalogic-wasm to ui/vendor/datalogic, which the
      # `prebuild*` hooks fill from the bindings/wasm/pkg built above.
      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: Build UI demo
        run: cd ui && npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Build UI embed bundle
        run: cd ui && npm run build:embed

      # Copy embed bundle to docs source assets (before mdbook build picks it up)
      - name: Copy embed bundle to docs source
        run: |
          mkdir -p docs/src/assets
          cp ui/dist-embed/datalogic-embed.js docs/src/assets/
          cp ui/dist-embed/datalogic-embed.css docs/src/assets/

      # Rebuild mdbook to include embed files
      - name: Rebuild documentation with embed bundle
        run: mdbook build docs

      # Combine outputs
      - name: Copy UI demo to docs
        run: |
          mkdir -p docs/book/playground
          cp -r ui/dist/* docs/book/playground/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/book'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
