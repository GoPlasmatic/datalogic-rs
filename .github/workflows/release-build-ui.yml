name: _release-build-ui

# Internal reusable workflow — called by release.yml's `build-ui` job.
# Consumes the `wasm-pkg` artifact (produced by release-build-wasm.yml)
# and produces `ui-package` containing the npm-publishable tree.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version, used to bump UI's package.json and pin its WASM dep"
        required: true
        type: string

jobs:
  build:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download wasm-pkg artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg/

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync UI version
        # `inputs.version` reaches the shell through the environment
        # rather than `${{ }}` interpolation. Expression interpolation
        # splices the value into the script *before* bash parses it, so
        # a value carrying shell metacharacters would execute rather than
        # be passed as an argument. The value is repo-derived and
        # tag-gated today, but an env var costs nothing and removes the
        # class of bug entirely.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd ui
          # Bump UI's own version
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Resolve @goplasmatic/datalogic-wasm from the freshly-built local
      # artifact rather than the registry. This job runs BEFORE
      # publish-wasm, so $VERSION does not exist on npm yet — pinning the
      # dep to it here is what broke the v5.3.0 release:
      #
      #   npm error code ETARGET
      #   npm error notarget No matching version found for
      #   @goplasmatic/datalogic-wasm@5.3.0
      #
      # A `file:` spec takes the registry off the critical path entirely,
      # and points at the same tree the build actually consumes: every
      # import of the package is aliased to `ui/vendor/datalogic` (see
      # vite.config.ts, vite.lib.config.ts, vitest.config.ts and
      # tsconfig.{app,lib}.json), which the `sync-wasm` prebuild hook
      # copies out of `../bindings/wasm/pkg`. node_modules never feeds the
      # build; the dep is declared for provenance, not resolution.
      #
      # The previous `npm link` step could not survive the install that
      # followed it — `npm install` re-resolves from package.json and the
      # lockfile, replacing the symlink.
      - name: Point WASM dep at the local build artifact
        run: |
          cd ui
          npm pkg set "devDependencies.@goplasmatic/datalogic-wasm=file:../bindings/wasm/pkg"

      - name: Install UI dependencies
        run: cd ui && npm install

      - name: Build UI library
        run: cd ui && npm run build:lib

      # Restore the published manifest's pin now that nothing else needs
      # to resolve it. publish-ui `needs: publish-wasm`, so $VERSION is on
      # npm before this package.json is ever published — no skew, and no
      # `file:` spec leaking into the published tarball.
      - name: Pin WASM dep to the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd ui
          npm pkg set "devDependencies.@goplasmatic/datalogic-wasm=$VERSION"

      # Bundle only the files `npm publish` actually packs — everything
      # listed in package.json's `files` field plus the package manifest,
      # README, LICENSE. node_modules is intentionally excluded (it
      # carries the `file:`-linked local WASM package, which would not
      # match the published WASM dep).
      - name: Upload ui-package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-package
          path: |
            ui/package.json
            ui/package-lock.json
            ui/README.md
            ui/LICENSE
            ui/dist/
          if-no-files-found: error
