name: _release-build-wasm

# Internal reusable workflow — called by release.yml's `build-wasm` job
# to produce the `wasm-pkg` artifact that publish-wasm and build-ui
# consume. Not intended for direct invocation; there's no
# workflow_dispatch trigger.

on:
  workflow_call:

# The Rust release that builds the shipped artifacts, pinned so a tag
# rebuilt later produces the same binaries and a new stable cannot change
# a release unreviewed. Keep it the same in every release-build-*.yml, and
# at or above `rust-version` in the root Cargo.toml.
env:
  RELEASE_RUST: '1.98.1'

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: wasm-pack@0.14.0

      # Pinned and checksum-verified; the same version ci.yml's size gate
      # measures with.
      - name: Install binaryen
        uses: ./.github/actions/install-binaryen

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bindings/wasm/target/
          key: ${{ runner.os }}-wasm-${{ env.RELEASE_RUST }}-${{ hashFiles('bindings/wasm/Cargo.toml', 'bindings/wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-${{ env.RELEASE_RUST }}-

      # wasm-pack cannot be handed `--locked`; fail here instead if the
      # committed lockfile no longer describes the manifest, so the build
      # below resolves exactly the reviewed dependency set.
      - name: Verify bindings/wasm/Cargo.lock is current
        run: cargo metadata --locked --format-version 1 --manifest-path bindings/wasm/Cargo.toml > /dev/null

      - name: Build WASM
        run: cd bindings/wasm && ./build.sh

      - name: Upload wasm-pkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: bindings/wasm/pkg/
          if-no-files-found: error
