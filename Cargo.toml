[workspace]
resolver = "3"
members = [
    "crates/datalogic-rs",
    "crates/datalogic-bind",
    "tools/benchmark",
]
# `bindings/wasm` defines its own `[workspace]` so wasm-pack can apply its
# WASM-specific `[profile.release]` (opt-level "z", lto, panic = "abort")
# without contaminating the rest of the tree. `bindings/python`,
# `bindings/c`, and `bindings/node` are excluded so contributors don't
# need a Python / Node toolchain or have to wait on cbindgen+cdylib /
# napi build codegen just to run `cargo test --workspace --all-features`
# against core. `ui` is a Node package and is invisible to Cargo regardless.
exclude = [
    "bindings/wasm",
    "bindings/python",
    "bindings/c",
    "bindings/node",
    "ui",
    # cargo-fuzz crate: needs nightly + libfuzzer, run explicitly via
    # `cargo +nightly fuzz run eval_str` from crates/datalogic-rs/.
    "crates/datalogic-rs/fuzz",
]

[workspace.package]
edition = "2024"
# The MSRV of every root-workspace member. The floor is inherited, not
# chosen: `datavalue-rs` 0.3 declares `rust-version = "1.98"`, and it is a
# non-optional dependency of the core crate, so every build needs 1.98
# whether or not `tensor` is on. The previous 1.85 floor tracked edition
# 2024 and the crate's own language use, which is still 1.85; nothing in
# the core needs 1.98 directly. `scripts/check-stats.sh` holds the MSRV
# quoted in the docs and the CI `msrv` job to this value.
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Harishankar Narayanan <nharishankar@gmail.com>"]
repository = "https://github.com/GoPlasmatic/datalogic-rs"

# Requirements shared by more than one root-workspace member, so the core,
# `datalogic-bind` and the benchmark cannot drift onto different floors.
# The floors are the minimum versions the core compiles against; the
# `minimal-versions` CI job enforces them. Members add features on top
# (`bumpalo = { workspace = true, features = ["collections"] }`). The
# binding workspaces are separate roots and keep their own requirements.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bumpalo = "3.20"

# Lint policy for the members that opt in with `[lints] workspace = true`
# (`datalogic-bind`, the benchmark). The core crate keeps the same policy
# as inner attributes at the top of `src/lib.rs`, where it applies to the
# library alone: its integration tests install a counting global
# allocator (`tests/owned_input_test.rs`), which needs `unsafe`, and
# `missing_docs` / `unreachable_pub` describe the public API, not test
# and example crates.
[workspace.lints.rust]
unsafe_code = "forbid"

# `lto = "fat"` + `codegen-units = 1` lets the compiler propagate the
# load-bearing `#[inline(always)]` decisions across crate/CGU boundaries
# in the dispatch hot path. The WASM workspace defines its own
# `[profile.release]` so it is unaffected.
[profile.release]
lto = "fat"
codegen-units = 1
# Line tables let cargo-flamegraph / samply / Instruments resolve frame
# names without bloating the binary much. Comment out for a strip-only
# release build.
debug = "line-tables-only"

[profile.bench]
inherits = "release"
