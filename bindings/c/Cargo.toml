# `[workspace]` makes this crate its own workspace root for the same reason
# `bindings/wasm` and `bindings/python` do: keeps the C ABI's binding deps
# and `cdylib`/`staticlib` outputs from contaminating the root workspace's
# `cargo test --workspace --all-features` path. The parent `Cargo.toml`
# excludes this directory.
[workspace]

[package]
name = "datalogic-c"
version = "5.8.0"
edition = "2024"
description = "C ABI for the datalogic-rs JSONLogic engine — shared FFI surface for Go, PHP, JVM, and other C-FFI consumers"
license = "Apache-2.0"
repository = "https://github.com/GoPlasmatic/datalogic-rs"
# Consumed in-tree by the Go, JVM, .NET and PHP bindings, never from
# crates.io (and it depends on the unpublished `datalogic-bind`).
publish = false

[lib]
# `cdylib`    — the importable shared library (`.so`/`.dylib`/`.dll`)
#               for cgo, PHP FFI, JVM FFM, dlopen, etc.
# `staticlib` — for consumers that want to statically link (e.g. a Go
#               binary with a self-contained datalogic).
# `rlib`      — lets `tests/smoke.rs` (and downstream Rust crates) link
#               the binding as a normal Rust dep and call the extern fns
#               directly without going through dlopen.
crate-type = ["cdylib", "staticlib", "rlib"]
name = "datalogic_c"

[dependencies]
# Wire formats and plumbing shared with the other bindings.
datalogic-bind = { path = "../../crates/datalogic-bind" }
# Feature set mirrors `bindings/python` so a rule that runs from Python
# also runs through the C ABI without surprise. `all-operators` gives
# every downstream consumer (Go, Java, .NET, PHP) every operator family,
# flagd's `fractional` and `sem_ver` among them; `trace` is wired up via
# `datalogic_traced_session_*` in `src/traced_session.rs`. The version is
# the floor this crate's API use needs (the 5.8 introspection and
# per-compile modes).
datalogic-rs = { path = "../../crates/datalogic-rs", version = "5.8", features = [
    "serde_json",
    "all-operators",
    "trace",
    "templating",
    "budget",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
# `cbindgen` regenerates `include/datalogic.h` on every build. The
# generated header is committed so downstream C/Go/PHP/JVM consumers
# don't need cbindgen on their box.
#
# Pinned to 0.29+ because earlier versions don't recognise the Rust 2024
# `#[unsafe(no_mangle)]` attribute syntax we use on the `extern "C"`
# entry points — they silently skip the symbols and produce an empty
# header instead of a parse error.
cbindgen = "0.29"

[profile.release]
lto = "fat"
codegen-units = 1
# Line tables let perf tools resolve frames without bloating the .so.
debug = "line-tables-only"

# The Go module tag commits one staticlib per platform, and the Go module
# proxy caps a module zip at 500 MiB. Under `release`, the staticlib
# carried line tables and, because it shared a rustc invocation with the
# rlib, every dependency's object plus its embedded LLVM bitcode: about
# 80 MB per platform. The Go build (bindings/go/Makefile and
# release-build-go.yml) uses this profile with
# `cargo rustc --crate-type staticlib`, so fat LTO folds the crate graph
# into one object, and no debuginfo is emitted: about 13 MB on
# darwin-arm64.
[profile.go-release]
inherits = "release"
debug = false
strip = "debuginfo"
