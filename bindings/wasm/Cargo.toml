# `[workspace]` makes this crate its own workspace root so wasm-pack can
# apply the WASM-specific `[profile.release]` below (opt-level "z", lto,
# panic = "abort") without contaminating the rest of the monorepo. The
# parent `Cargo.toml` at the repo root excludes this path for the same
# reason.
[workspace]

[package]
name = "datalogic-wasm"
version = "5.8.1"
edition = "2024"
description = "WebAssembly bindings for datalogic-rs JSONLogic engine"
license = "Apache-2.0"
repository = "https://github.com/GoPlasmatic/datalogic-rs"
# Published to npm as @goplasmatic/datalogic-wasm (see build.sh), not to
# crates.io (and it depends on the unpublished `datalogic-bind`).
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Applies to any `wasm-pack build --profile <name>` (wasm-pack has one
# `custom` bucket for all user-defined cargo profiles — used here by the
# opt-in speed profile). Same reason as above: build.sh runs its own
# wasm-opt pass with the feature flags the module needs; wasm-pack's
# built-in pass would fail on bulk-memory ops.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Wire formats and plumbing shared with the other bindings.
datalogic-bind = { path = "../../crates/datalogic-bind" }
# The binding builds against the in-tree core (`path`); `version` is the
# floor its API use needs (5.8: per-compile modes, check, operators,
# facts). The crate ships to npm, never to crates.io.
# The `datalogic-rs` crate re-exports `bumpalo`, so this crate uses
# `datalogic_rs::bumpalo` instead of pulling its own copy — keeps the
# major version aligned automatically.
# Feature list is inlined here (rather than via an umbrella feature on the
# core crate) so the binding owns its operator surface and the core
# Cargo.toml stays free of binding-specific bundling. `all-operators`
# gives the JS/UI playground every operator family; a family left out
# here would compile its names as unknown operators.
datalogic-rs = { path = "../../crates/datalogic-rs", version = "5.8", features = [
    "all-operators",
    # This package is wasm-bindgen based, i.e. always hosted by JS, so the
    # JS clock is safe here; without it `now` traps on wasm32. Core
    # consumers targeting non-JS wasm runtimes (wasmtime, wazero, Chicory)
    # must NOT enable `wasm-clock` — issue #47.
    "wasm-clock",
    "trace",
    "templating",
    "budget",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Opt-in speed profile (`WASM_PROFILE=speed ./build.sh`): identical to
# release except the optimizer chases speed instead of size (and build.sh
# pairs it with `wasm-opt -O3` instead of `-Oz`). The published package
# stays on the default size-optimized release profile; this exists for
# consumers who care more about ns/op than KB — measured size/speed
# tradeoff in the README's "Build profiles" section. Inert unless
# explicitly selected.
[profile.speed]
inherits = "release"
opt-level = 3
