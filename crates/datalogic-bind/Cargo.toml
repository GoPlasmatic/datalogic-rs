[package]
name = "datalogic-bind"
version = "5.8.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared wire formats and plumbing for the datalogic-rs language bindings"
# Internal to the bindings for now: each binding builds it from the tree
# (maturin carries path dependencies into the sdist), so it is not published.
publish = false

[dependencies]
datalogic-rs = { path = "../datalogic-rs", version = "5.8", features = ["serde_json", "trace", "budget", "templating"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }

[lints]
workspace = true

[dev-dependencies]
datalogic-rs = { path = "../datalogic-rs", version = "5.8", features = ["serde_json", "trace", "budget", "all-operators", "templating"] }
