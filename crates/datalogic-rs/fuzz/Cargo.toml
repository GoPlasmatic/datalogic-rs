# Standalone workspace: keeps the sanitizer-instrumented fuzz build (and
# its nightly-only flags) out of the root workspace's lockfile and builds.
[workspace]

[package]
name = "datalogic-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# A fuzz target's name is the argument users type
# (`cargo +nightly fuzz run eval_str`, as DEVELOPMENT.md documents) and
# the directory cargo-fuzz stores its corpus and crash artifacts under.
# cargo-fuzz's own scaffolding generates snake_case names, so renaming to
# satisfy the kebab-case lint would break the documented command and
# orphan the corpus for nothing.
[lints.cargo]
non_kebab_case_bins = "allow"

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.datalogic-rs]
path = ".."
features = [
    "serde_json",
    "templating",
    "trace",
    "datetime",
    "error-handling",
    "ext-string",
    "ext-array",
    "ext-control",
    "ext-math",
    "flagd",
]

[[bin]]
name = "eval_str"
path = "fuzz_targets/eval_str.rs"
test = false
doc = false
bench = false
